[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-av-sdk"
# 2.0.0 is already on PyPI, published as MIT, and PyPI releases are immutable. The Apache-2.0
# licensing this file declares can therefore only reach a user at a NEW version — see
# scripts/registry_license_truth.py, which fails the build if this ever collides again.
#
# 3.0.0: the importable top-level module was renamed `wave` -> `wave_sdk` (ART-001/GA-2026-09-04).
# `wave` collides with the CPython stdlib module of the same name, and because the stdlib
# directory precedes site-packages on sys.path, `import wave` always resolved to the stdlib WAV
# reader, never to this SDK, on every published version through 2.0.1. The documented
# `from wave import Wave` entry point could never succeed for a real installer — this is a
# correctness fix, not a break of a working integration, and it is why the major version moves.
version = "3.0.0"
description = "Official WAVE SDK for Python - 33 API modules for streaming, production, analytics, and more"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "WAVE Inc.", email = "sdk@wave.online"}
]
keywords = [
    "wave",
    "streaming",
    "video",
    "audio",
    "broadcast",
    "production",
    "ndi",
    "srt",
    "webrtc",
    "clips",
    "editor",
    "voice",
    "transcription",
    "captions",
    "analytics",
    "ai",
    "sdk",
    "prism",
    "fleet",
    "mesh"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    # tests/test_packaging.py reads this file back to assert the shipped metadata
    # matches the repo (name/version). tomllib is stdlib from 3.11 only.
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://docs.wave.online/sdk/python"
Documentation = "https://docs.wave.online/sdk/python"
Repository = "https://github.com/wave-av/sdks"
Issues = "https://github.com/wave-av/sdks/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wave_sdk*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
