name: pypi publish (OIDC trusted publishing)

# Publishes wave-sdk (sdk-python) to PyPI from this PUBLIC repo so PyPI trusted publishing
# (OIDC, Sigstore attestations) works — it cannot from the private monorepo. NO PyPI token to
# leak/rotate; a Trusted Publisher must be registered on pypi.org for this repo + this workflow
# file + the `pypi-publish` environment before a real publish. Inert until then: tag pushes +
# the dry-run dispatch only build + validate the distributions.
#
# Canonical publisher of record for wave-sdk is now the standalone wave-av/sdk-python repo
# (Option A, ratified 2026-09-06 — see governance/evidence/ga/OWNER-BINDING-sdks-2026-09-05.md,
# ART-001/OWNER-BINDING). Jobs below are gated off by default; set the MONOREPO_NPM_PYPI_PUBLISH
# repo variable to "true" to re-enable this pipeline.
on:
  push:
    tags: ["sdk-python-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only (no publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: vars.MONOREPO_NPM_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Build sdist + wheel
        run: python -m pip install --upgrade build && python -m build
      - name: Validate metadata (twine check)
        run: python -m pip install --upgrade twine && python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-dist
          path: sdk-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only on a real tag push (not the dry-run dispatch). Requires the PyPI Trusted Publisher
    # + this environment to be registered first; otherwise the job is never reached on dispatch.
    # Also requires the MONOREPO_NPM_PYPI_PUBLISH repo variable (see header) since this pipeline
    # is frozen under Option A (2026-09-06).
    if: vars.MONOREPO_NPM_PYPI_PUBLISH == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-python-v')
    environment: pypi-publish      # required-reviewer gate on real publishes
    permissions:
      id-token: write              # OIDC trusted publishing + provenance attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist/
      - name: Publish to PyPI (OIDC trusted publishing — NO token, attestations ON)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
