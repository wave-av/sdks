name: ruby test

# Builds + tests the wave-sdk gem (sdk-ruby). The CI gate that fully verifies
# the Ruby SDK: syntax check, gem build, and the offline tcp-mock test suite.
on:
  pull_request:
    paths:
      - "sdk-ruby/**"
      - "codegen/**"
      - ".github/workflows/test-ruby.yml"
  push:
    branches: [main]
    paths:
      - "sdk-ruby/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.1", "3.3"]
    defaults:
      run:
        working-directory: sdk-ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Syntax check
        run: find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - name: Build gem
        run: gem build wave-sdk.gemspec
      - name: Test (offline)
        run: ruby -Ilib test/smoke_test.rb
