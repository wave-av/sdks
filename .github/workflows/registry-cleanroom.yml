name: registry clean-room acceptance

# Tests ONLY what the public registries serve — never this checkout.
#
# `registry parity` (the sibling workflow) answers "does the declared version equal the published
# version". That is necessary and not sufficient: it never installs anything, so it cannot see a
# package whose version number is right and whose CONTENTS are broken. Every artifact regression in
# the pre-GA audit was of that second kind — CI green on source while npm and PyPI served a broken
# build for days. This workflow installs the published artifact into a throwaway directory or venv
# and asserts it actually works.
#
# WHY NIGHTLY AND NOT ONLY ON RELEASE
# A published package can break with NO commit anywhere. @wave-av/cli's own published dependency
# range on @wave-av/sdk is a caret range, so what a customer receives is decided by npm's resolver
# on the day they install, not by anything in this repo. Only a scheduled run catches that.
#
# BLOCKING BEHAVIOUR (revised 2026-09-04, GA false-green remediation)
# Every trigger — schedule / workflow_run(release) / workflow_dispatch / pull_request — HARD
# FAILS the job (non-zero exit) when a published artifact fails clean-room acceptance.
# schedule / workflow_run / workflow_dispatch additionally open-or-update a tracking issue,
# because a nightly that fails quietly is worse than no nightly at all.
#
# Until 2026-09-04 pull_request ran the identical checks but always exited 0 — a `::warning`
# annotation stood in for a real result, so the GitHub check CONCLUSION read SUCCESS even when
# the run's own log ended "REGISTRY CLEAN-ROOM FAILED: 8 check(s)". sdks#79 merged on the
# strength of that green rollup, carrying the 8 known artifact defects onto main un-remediated.
# That is now impossible: this job reports its true state on every event.
#
# WHY IT IS NOT (yet) A *REQUIRED* STATUS CHECK
# Failing honestly and being required to merge are two different questions. As of 2026-09-04
# this repo's own published artifacts, plus artifacts published from wave-av/cli and
# wave-av/sdk-python that this gate also tests, carry known defects (see GA-READINESS.md,
# "Arming window") that cannot be cleared by an sdks PR alone — some require a publish this
# workflow cannot make (npm/PyPI publish is operator-gated), some require a fix landing in a
# different repo. Making this check *required* today would red every future sdks PR for a
# defect that PR did not introduce and cannot fix — training reviewers to override or ignore a
# required check is worse than not having one. So: loud-but-advisory now (this job fails
# honestly, and that failure is visible on statusCheckRollup), required later, once
# GA-READINESS.md's "Arming window" section reports zero outstanding cleanroom failures. There
# is deliberately NO path filter: the check reports on every PR, which is what makes it eligible
# to become a required status check later without a permanently-unreported gap (a path-filtered
# required check blocks every PR that misses the filter — the lesson already recorded in
# registry-parity.yml).

on:
  schedule:
    # 09:00 UTC — deliberately offset from `registry parity` (14:00) so a registry outage does not
    # take out both signals in the same window.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: 'Exact versions to accept, e.g. "@wave-av/cli=1.0.9,wave-sdk=2.1.0" (default: registry latest)'
        type: string
        required: false
      only:
        description: 'Comma-separated target ids to run (default: all). Ids are in scripts/ga/cleanroom-targets.json'
        type: string
        required: false
  workflow_run:
    # Runs after a real publish so a release is verified against the registry it just wrote to.
    workflows: ["npm publish (OIDC + provenance)"]
    types: [completed]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On workflow_run, only a SUCCESSFUL publish is worth verifying; a failed publish has its own
    # error and would produce a confusing second failure here.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      issues: write # fail-loud: open or update the tracking issue
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run clean-room acceptance against the public registries
        id: cleanroom
        env:
          CLEANROOM_VERSIONS: ${{ inputs.versions }}
          ONLY: ${{ inputs.only }}
        run: |
          set -uo pipefail
          args=(--python python3 --out-dir "$GITHUB_WORKSPACE/ga-out")
          [ -n "${ONLY:-}" ] && args+=(--only "$ONLY")
          set +e
          node scripts/ga/registry-cleanroom.mjs "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/cleanroom.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Registry clean-room acceptance"
            echo
            echo "Exit code \`$code\` (0 = all checks passed, 1 = an artifact failed, 2 = the gate could not run)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/cleanroom.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload GA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ga-evidence-registry-cleanroom
          path: ga-out/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail loudly — open or update the tracking issue
        # A nightly that fails quietly is worse than no nightly at all.
        if: steps.cleanroom.outputs.exit_code != '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT_CODE: ${{ steps.cleanroom.outputs.exit_code }}
        run: |
          set -euo pipefail
          title="registry clean-room acceptance is failing"
          # Only the failing-check lines: the issue must say WHAT is broken, not page a human to
          # go read a log to find out.
          summary=$(sed -n '/^REGISTRY CLEAN-ROOM FAILED/,$p' "$RUNNER_TEMP/cleanroom.log" | head -40)
          [ -z "$summary" ] && summary="The gate did not complete (exit $EXIT_CODE). See the run log."
          body=$(printf '%s\n\n```\n%s\n```\n\nRun: %s\nEvent: %s\n\nThe published artifacts do not satisfy ART-001 / SUPPLY-001 / VER-001. A green source branch does not certify these — the registry is what customers install.\n' \
            "Clean-room acceptance against the public registries failed." "$summary" "$RUN_URL" "$GITHUB_EVENT_NAME")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
              || echo "::warning::could not open the tracking issue; the job still fails below"
          fi

      - name: Enforce
        # Hard-fail on every trigger, including pull_request. A PR did not publish the artifact
        # under test and cannot fix it by itself — but that is an argument against making this a
        # *required* branch-protection check while known registry defects are outstanding
        # (tracked separately; see GA-READINESS.md "Arming window"), never an argument for
        # reporting a false SUCCESS. Before 2026-09-04 this step no-opped on pull_request and a
        # sibling "informational" step printed a ::warning while still exiting 0 — so the check
        # conclusion read SUCCESS on a PR whose own log said "REGISTRY CLEAN-ROOM FAILED: 8
        # check(s)" (sdks#79, merged 2026-09-04T18:25:54Z on the strength of that green rollup).
        # A gate that cannot fail is not a gate. This step now fails loud on every event; the
        # only thing pull_request changes is whether GitHub treats that failure as *required*,
        # and that is controlled by branch protection, not by this workflow.
        env:
          CODE: ${{ steps.cleanroom.outputs.exit_code }}
        run: |
          if [ "$CODE" != "0" ]; then
            echo "::error title=registry clean-room::published artifacts failed clean-room acceptance (exit $CODE) — see the job summary"
            exit 1
          fi
          echo "registry clean-room acceptance passed"
