name: python test

# Installs sdk-python and runs its offline test suite. This is the CI gate that fully
# verifies the carve (local verification was limited by toolchain; CI installs httpx/pydantic
# and runs pytest for real).
on:
  pull_request:
    paths:
      - "sdk-python/**"
      - ".github/workflows/test-python.yml"
  push:
    branches: [main]
    paths:
      - "sdk-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test (offline)
        run: python -m pytest -q
